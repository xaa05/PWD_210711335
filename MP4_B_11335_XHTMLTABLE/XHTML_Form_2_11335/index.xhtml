<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Workshop</title>
</head>
<body>
    <h1>Formulir Pendaftaran Workshop</h1>
    <form action="" method="post" enctype="multipart/form-data">
        
        <!-- Tabel 1: Data Peserta -->
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <th colspan="2" align="left">Data Peserta</th>
            </tr>
            <tr>
                <td style="width:32%;"><label for="nama">Nama Lengkap</label></td>
                <td><input type="text" id="nama" name="nama" size="30" /></td>
            </tr>
            <tr>
                <td style="width:32%;"><label for="nim">NIM</label></td>
                <td><input type="text" id="nim" name="nim" size="30" /></td>
            </tr>
            <tr>
                <td style="width:32%;">Jenis Kelamin</td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-laki" />
                    <label for="laki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;"><label for="prodi">Program Studi</label></td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <br />

        <!-- Tabel 2: Pilihan Workshop -->
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <th colspan="2" align="left">Pilihan Workshop</th>
            </tr>
            <tr>
                <td style="width:32%;">Jenis Peserta</td>
                <td>
                    <input type="radio" id="mahasiswa" name="jenis_peserta" value="Mahasiswa" />
                    <label for="mahasiswa">Mahasiswa</label>
                    <input type="radio" id="umum" name="jenis_peserta" value="Umum" />
                    <label for="umum">Umum</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">Materi Workshop</td>
                <td>
                    <input type="checkbox" id="uiux" name="materi" value="UI/UX Design" />
                    <label for="uiux">UI/UX Design</label>
                    <input type="checkbox" id="webdev" name="materi" value="Web Development" />
                    <label for="webdev">Web Development</label>
                    <input type="checkbox" id="data" name="materi" value="Data Analysis" />
                    <label for="data">Data Analysis</label>
                </td>
            </tr>
        </table>

        <br />

        <!-- Tabel 3: Informasi Tambahan -->
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <th colspan="2" align="left">Informasi Tambahan</th>
            </tr>
            <tr>
                <td style="width:32%; vertical-align: top;"><label for="alasan">Alasan Mengikuti Workshop</label></td>
                <td>
                    <textarea id="alasan" name="alasan" rows="6" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">Jenis Pembayaran</td>
                <td>
                    <input type="radio" id="qris" name="pembayaran" value="QRIS" />
                    <label for="qris">QRIS</label>
                    <input type="radio" id="tf" name="pembayaran" value="Transfer Bank" />
                    <label for="tf">Transfer Bank</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;"><label for="bukti">Bukti Pembayaran</label></td>
                <td>
                    <input type="file" id="bukti" name="bukti" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="daftar" value="Daftar" />
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
